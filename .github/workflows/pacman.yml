name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: HimaniAgrawal-10
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00bfff&color_dots=#dbeafe,#93c5fd,#60a5fa,#3b82f6,#1d4ed8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00bfff&color_dots=#0f172a,#1e3a8a,#2563eb,#60a5fa,#93c5fd

      - name: Push snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
